name: new rtorrent release

on:
  schedule:
    - cron: "8 17 * * *"
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          activate-environment: "true"

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check for open release PR
        id: open-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          n="$(gh pr list --state open --head auto/rtorrent-release --json number --jq length)"
          if [ "$n" -gt 0 ]; then
            echo "Release PR already open, skipping this release"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for new release
        if: steps.open-pr.outputs.skip != 'true'
        id: check
        run: uv run python scripts/new-rtorrent-release.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run pre-commit
        if: steps.open-pr.outputs.skip != 'true'
        run: uvx prek run --all-files || true

      - name: Create pull request
        if: steps.open-pr.outputs.skip != 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "feat: add manifest for latest rtorrent release"
          token: "${{ secrets.PAT }}"
          title: "feat: add manifest for latest rtorrent release"
          branch: auto/rtorrent-release
          labels: ci:auto-merge
          body: Automated manifest creation for the latest rtorrent release.
